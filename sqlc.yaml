version: "2"
sql:
  - engine: "postgresql"
    queries: "./db/queries/"
    schema: "./db/schema/"
    gen:
      go:
        package: "db"
        out: "./db/sqlc/"
        emit_json_tags: true
        overrides:
          - column: "user.age"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "user.industry"
            go_type:
              type: "string"
              pointer: true
          - column: "event.description"
            go_type:
              type: "string"
              pointer: true
